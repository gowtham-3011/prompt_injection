name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite uses MockLLM only: no API key, no model download, no network.
      # Heavy deps (torch, transformers, datasets) are needed to TRAIN the classifier,
      # not to run the tests, so CI installs the light set and stays fast.
      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy pandas scikit-learn joblib matplotlib \
                      httpx fastapi uvicorn tqdm python-dotenv pyflakes

      - name: Lint
        run: python -m pyflakes src/ experiments/ tests/ app_ui/

      - name: Run tests
        run: python -m pytest -q

      # Fast end-to-end check that the attack suite, firewall and harness still agree:
      # deterministic, offline, and fails loudly if a layer stops working.
      - name: Smoke-test the firewall end to end
        run: |
          python experiments/eval_heuristics.py --threshold 0.6
          python experiments/train_classifier.py --kind tfidf --no-public
          python experiments/run_ablation.py --backend mock --runs 1 \
                 --configs no_firewall all_layers
