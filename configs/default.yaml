# Default configuration. Override any key from the CLI with `--set a.b=value`,
# or pick the backend with the PIF_LLM_BACKEND / PIF_LLM_MODEL env vars.

seed: 1234

llm:
  backend: ollama            # anthropic | ollama | mock  (mock = unit tests / CI only)

  anthropic:
    model: claude-opus-5
    max_tokens: 16000
    effort: null             # optional: low | medium | high | xhigh | max
    # Server-side refusal fallback: if a safety classifier declines a request, the API
    # re-runs it on a fallback model instead of returning an empty refusal.
    refusal_fallback: true
    timeout_s: 120

  ollama:
    model: llama3.2:3b
    host: http://localhost:11434   # overridden by OLLAMA_HOST if set
    temperature: 0.7               # > 0 so repeated runs vary; the seed makes each run replayable
    num_ctx: 8192
    timeout_s: 300

  mock:
    # Probability that MockLLM obeys an injected instruction it finds in its context.
    compliance_prob: 0.8

agent:
  assistant_name: MailPilot
  user_name: Alex Chen
  user_email: alex.chen@acme-corp.example
  max_steps: 6               # hard cap on model calls per task (prevents infinite tool loops)
